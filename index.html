<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h2>User Registration</h2>
        <form id="registrationForm" novalidate>
            <!-- Name -->
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" placeholder="Enter full name">
                <small class="error-msg" id="nameError"></small>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" placeholder="Enter email address">
                <small class="error-msg" id="emailError"></small>
            </div>

            <!-- Phone -->
            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter phone number">
                <small class="error-msg" id="phoneError"></small>
            </div>

            <!-- Age -->
            <div class="form-group">
                <label for="age">Age *</label>
                <input type="number" id="age" name="age" placeholder="Enter age (12-100)">
                <small class="error-msg" id="ageError"></small>
            </div>

            <!-- Gender -->
            <div class="form-group">
                <label>Gender *</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="male"> Male</label>
                    <label><input type="radio" name="gender" value="female"> Female</label>
                    <label><input type="radio" name="gender" value="other"> Other</label>
                </div>
                <small class="error-msg" id="genderError"></small>
            </div>

            <!-- Address -->
            <div class="form-group">
                <label for="address">Address (Optional)</label>
                <textarea id="address" name="address" rows="3" placeholder="Enter address (max 50 chars)"></textarea>
                <small class="error-msg" id="addressError"></small>
            </div>

            <button type="submit" class="submit-btn">Register</button>
            <div id="successMessage" class="success-msg"></div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
